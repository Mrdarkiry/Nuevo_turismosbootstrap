<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrusel · Turismo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container my-4">
    <a href="index.html">← Volver al inicio</a>
    <h1>Paisajes de Chile</h1>
    <div id="carruselTurismo" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="https://picsum.photos/seed/atacama/1000/450" class="d-block w-100" alt="Paisaje 1">
        </div>
        <div class="carousel-item">
          <img src="https://picsum.photos/seed/patagonia/1000/450" class="d-block w-100" alt="Paisaje 2">
        </div>
        <div class="carousel-item">
          <img src="https://picsum.photos/seed/lago/1000/450" class="d-block w-100" alt="Paisaje 3">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#carruselTurismo" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carruselTurismo" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
      </button>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
